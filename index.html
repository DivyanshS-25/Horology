<body class="site-wrapper">
  <!-- Accessibility Skip-to-Content Link -->
  <a href="#app" class="sr-only">Skip to main content</a>

  <!-- Application Initialization Loader (Fades out when router mounts) -->
  <div id="appLoader" class="app-loader" role="status" aria-live="polite" aria-label="Loading HOROLOGY">
    <div class="app-loader-content">
      <div class="brand-wordmark mb-3 animate-pulse" style="font-size: 2.2rem; justify-content: center;">
        <span style="color: #D4AF37; margin-right: 8px;">⌖</span>
        <span>HOROLOGY</span>
      </div>
      <p class="body-muted font-mono" style="font-size: var(--text-xs); letter-spacing: 0.15em; text-transform: uppercase;">
        Beyond Time. Beyond Ordinary.
      </p>
      <div id="loaderStatus" class="font-mono text-2xs" style="color: var(--text-muted); margin-top: 16px; min-height: 18px; font-size: 11px;">
        Initializing Observatory...
      </div>
      <div id="loaderRecovery" style="display: none; margin-top: 20px;">
        <p id="loaderErrorMessage" style="color: var(--accent-primary); font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px; line-height: 1.5;">
          Initialization timeout. Click below to proceed.
        </p>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-primary btn-sm" id="btnForceDismissLoader" style="font-size: 11px;">
            Enter Observatory
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="window.location.reload()" style="font-size: 11px;">
            Reload Page
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Persistent Header Mount -->
  <header id="siteHeader" class="site-header" role="banner"></header>

  <!-- Global Search Overlay Portal -->
  <div id="searchOverlay" class="search-overlay"></div>

  <!-- Mobile Drawer Navigation Portal -->
  <div id="mobileDrawer" class="mobile-drawer"></div>

  <!-- Main View Container (Client Hash Router Mount) -->
  <main id="app" class="site-main" role="main" tabindex="-1"></main>

  <!-- Global Persistent Footer Mount -->
  <footer id="siteFooter" class="site-footer" role="contentinfo"></footer>

  <!-- Modal Dialog Portal -->
  <div id="modalPortal" class="modal-portal"></div>

  <!-- Accessible Toast Notification Region -->
  <div id="toastRegion" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Non-Module Inline Guardian Script (Guarantees Loader Dismissal & Diagnostics Even on Network/CORS Issues) -->
  <script>
    (function() {
      // Diagnostic check: running directly from file:// protocol
      if (window.location.protocol === 'file:') {
        var statusEl = document.getElementById('loaderStatus');
        var recoveryEl = document.getElementById('loaderRecovery');
        var errorMsg = document.getElementById('loaderErrorMessage');
        if (statusEl) statusEl.textContent = 'Local File Protocol Detected';
        if (errorMsg) {
          errorMsg.innerHTML = 'Browsers block JavaScript ES modules on <code>file:///</code> URLs.<br>Please open via a local server (e.g. <code>powershell -File .\\scratch\\server.ps1</code> or <code>npx serve</code>) or GitHub Pages.';
        }
        if (recoveryEl) recoveryEl.style.display = 'block';
      }

      // Safety timeout: If app hasn't signaled ready within 3.5s, surface recovery options
      setTimeout(function() {
        if (!window.__HOROLOGY_READY__) {
          var recoveryEl = document.getElementById('loaderRecovery');
          var statusEl = document.getElementById('loaderStatus');
          if (statusEl) statusEl.textContent = 'Initialization Timeout';
          if (recoveryEl) recoveryEl.style.display = 'block';
        }
      }, 3500);

      // Force Dismiss Button
      var forceBtn = document.getElementById('btnForceDismissLoader');
      if (forceBtn) {
        forceBtn.addEventListener('click', function() {
          var loader = document.getElementById('appLoader');
          if (loader) {
            loader.classList.add('app-loader-hidden');
            setTimeout(function() { loader.style.display = 'none'; }, 350);
          }
        });
      }
    })();
  </script>

  <!-- ES Module Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
